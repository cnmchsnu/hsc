name: Mirror Repository

on:
  push:
    branches:
      - dev


jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push Mirror
        run: |
          git remote add mirror https://x-access-token:${{ secrets.HSCSHOP_MIRROR_DEPLOY }}@github.com/ip192htwhsnu/hscshop-dev-deploy.git
          git push mirror main --force